apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration block.
 * Register debuggable variants so RN can skip JS bundling during debug/QA-debug builds.
 */
react {
    debuggableVariants = ["qaDebug", "qaDebugOptimized", "prodDebug", "prodDebugOptimized"]
    autolinkLibrariesWithApp()
}

/**
 * Load release signing credentials from keystore.properties.
 * NEVER commit keystore.properties — it is gitignored.
 * Copy keystore.properties.example → keystore.properties and fill in your values.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * Enable Proguard / R8 minification on release builds.
 * Set to false while developing; re-enable before publishing to store.
 */
def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.starterapp"

    defaultConfig {
        applicationId "com.starterapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            } else {
                // Fallback to debug keystore when no release keystore is configured
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    /**
     * Product Flavors — two environments:
     *   qa   → QA / tester builds. Uses applicationIdSuffix ".qa" so it installs
     *           alongside the production app on the same device.
     *   prod → Production builds. Uses the base applicationId.
     */
    flavorDimensions "environment"
    productFlavors {
        qa {
            dimension "environment"
            applicationIdSuffix ".qa"
            versionNameSuffix "-QA"
            resValue "string", "app_flavor_label", "QA"
        }
        prod {
            dimension "environment"
            resValue "string", "app_flavor_label", "Production"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    /**
     * Output APK filename pattern:
     *   StarterApp-qa-debug.apk
     *   StarterApp-qa-release.apk
     *   StarterApp-prod-release.apk
     */
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavor = variant.productFlavors[0].name
            def buildType = variant.buildType.name
            outputFileName = "StarterApp-${flavor}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
